<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQ & FP Operational Control Center</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }

        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 12px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 6px; border: 2px solid #0b0f19; }
        ::-webkit-scrollbar-thumb:hover { background: #fbbf24; }

        .custom-scroll {
            scrollbar-width: auto;
            scrollbar-color: #f59e0b #0b0f19;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">

    <!-- HEADER -->
    <header class="bg-slate-900/90 border-b border-slate-800 px-8 py-3 sticky top-0 z-50 flex flex-col md:flex-row justify-between items-center gap-4 shadow-xl backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center font-black text-slate-950 shadow-lg text-base">
                ⚡
            </div>
            <div>
                <h1 class="text-lg font-extrabold text-white flex items-center gap-2">
                    EQ & FP <span class="text-amber-400">OPERATIONAL CONTROL CENTER</span>
                </h1>
                <p class="text-[10px] text-slate-400 tracking-widest uppercase font-semibold">Consolidado de Campañas y Métricas Maestras</p>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3 bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-1.5 shadow-inner">
                <div class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </div>
                <div>
                    <span class="block text-[9px] font-bold text-slate-400 uppercase">Agentes Activos</span>
                    <span id="kpi-total-agents" class="text-base font-black text-amber-400 leading-none">0</span>
                </div>
            </div>

            <button onclick="refreshCurrentView()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-xs px-4 py-2 rounded-xl transition-all shadow-lg active:scale-95 flex items-center gap-2">
                <span>Sincronizar</span>
            </button>
        </div>
    </header>

    <!-- NAVEGACIÓN TABS -->
    <nav class="bg-slate-900/70 border-b border-slate-800 px-6 py-2 sticky top-[61px] z-40 flex flex-wrap items-center gap-1.5 backdrop-blur-md">
        <button id="tab-daily" onclick="switchSection('daily')" class="tab-btn">Daily</button>
        <button id="tab-weekly" onclick="switchSection('weekly')" class="tab-btn">Weekly</button>
        <button id="tab-mtd" onclick="switchSection('mtd')" class="tab-btn">MTD Results</button>
        <div class="h-4 w-[1px] bg-slate-800 my-auto mx-2"></div>
        <button id="tab-productivity" onclick="switchSection('productivity')" class="tab-btn">Productivity</button>
        <button id="tab-commissions" onclick="switchSection('commissions')" class="tab-btn">Commissions</button>
        <button id="tab-call-review" onclick="switchSection('call-review')" class="tab-btn">Call Audit Review</button>
        <button id="tab-call-summary" onclick="switchSection('call-summary')" class="tab-btn">Call Audit Summary</button>
        <button id="tab-adherence" onclick="switchSection('adherence')" class="tab-btn">Adherence</button>
        <button id="tab-directory" onclick="switchSection('directory')" class="tab-btn">Directory</button>
    </nav>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 p-6 overflow-y-auto">
        <div id="loading" class="hidden flex flex-col justify-center items-center py-20 gap-3">
            <div class="w-8 h-8 border-4 border-amber-500/20 border-t-amber-500 rounded-full animate-spin"></div>
            <span class="text-xs font-semibold text-slate-400 uppercase">Cargando métricas...</span>
        </div>

        <div id="sheet-view-container" class="max-w-[1800px] mx-auto space-y-6"></div>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
